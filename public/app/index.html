<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <!-- Content-Security-Policy: nur eigene Skripte, Schriften und API; Kacheln von OSM.
       'unsafe-inline' bei Styles wegen style="…" in HTML und innerHTML-Templates.
       frame-ancestors wirkt nur als HTTP-Header (public/.htaccess). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/app/">
  <title>CacheCounty – Landkreise sammeln für Geocacher</title>
  <meta name="description" content="CacheCounty – die Karte für Geocacher: Markiere, in welchen Landkreisen, Bezirken und Kommunen du schon Caches gefunden hast, und sieh deinen Fortschritt für Deutschland, Österreich, die Schweiz und Dänemark.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CacheCounty">
  <meta property="og:locale" content="de_DE">
  <meta property="og:title" content="CacheCounty – Landkreise sammeln für Geocacher">
  <meta property="og:description" content="CacheCounty – die Karte für Geocacher: Markiere, in welchen Landkreisen, Bezirken und Kommunen du schon Caches gefunden hast, und sieh deinen Fortschritt für Deutschland, Österreich, die Schweiz und Dänemark.">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#3a2e1f">

  <link rel="stylesheet" href="vendor/leaflet/1.9.4/leaflet.css">
  <script src="vendor/leaflet/1.9.4/leaflet.js" defer></script>

  <link rel="stylesheet" href="vendor/fonts/fonts.css">

  <link rel="stylesheet" href="css/app.css?v=dev">
</head>
<body>

  <!-- Überschrift für Screenreader und Suchmaschinen; app.js passt sie auf /map/{user} an -->
  <h1 id="page-title" class="visually-hidden">CacheCounty – Landkreise sammeln für Geocacher</h1>

  <noscript>
    <div class="noscript-note">
      <p><strong>CacheCounty</strong> ist die Karte für Geocacher: Hier markierst du, in welchen
      Landkreisen, Bezirken und Kommunen du schon Caches gefunden hast – für Deutschland,
      Österreich, die Schweiz und Dänemark –, und verfolgst deinen Fortschritt in Statistiken
      und einer Rangliste.</p>
      <p>Die Karte benötigt JavaScript. Bitte aktiviere es in deinem Browser.</p>
    </div>
  </noscript>

  <header id="app-header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">◈</span>
        <span class="logo-text">Cache<em>County</em></span>
      </div>
      <div class="header-center">
        <select id="country-select" class="country-select" aria-label="Land auswählen"></select>
      </div>
      <div class="header-right">
        <div id="auth-area">
          <button id="btn-login" class="btn btn-ghost">Anmelden</button>
        </div>
      </div>
    </div>
    <div id="stats-bar" class="stats-bar hidden">
      <span id="stats-text"></span>
      <div id="stats-progress"><div id="stats-fill"></div></div>
    </div>
  </header>

  <main id="map-container">
    <div id="map"></div>

    <!-- ── Bundesland-Panel ── -->
    <div id="state-panel" class="state-panel">
      <button id="state-panel-toggle" class="state-panel-toggle" aria-label="Panel ein-/ausblenden">
        <span class="toggle-arrow">&#8250;</span>
      </button>
      <div class="state-panel-inner">
        <div class="state-panel-header">
          <span id="state-panel-title" class="state-panel-title">Bundesländer</span>
          <div class="state-panel-actions">
            <button id="btn-states-all"  class="btn-state-quick">Alle</button>
            <button id="btn-states-none" class="btn-state-quick">Keine</button>
          </div>
        </div>
        <ul id="state-list" class="state-list"></ul>
      </div>
    </div>
    <div id="owner-badge" class="owner-badge hidden">
      <span class="owner-avatar" id="owner-avatar"></span>
      <div class="owner-info">
        <span class="owner-label">Karte von</span>
        <span id="owner-name" class="owner-name"></span>
      </div>
    </div>
    <div id="map-loader" class="map-loader">
      <div class="loader-inner">
        <div class="loader-spinner"></div>
        <span class="loader-text">Karte wird geladen…</span>
      </div>
    </div>
  </main>

  <!-- ── Landkreis-Dialog ── -->
  <div id="region-dialog" class="dialog hidden" role="dialog" aria-modal="true" aria-labelledby="dialog-name">
    <div class="dialog-inner">
      <button class="dialog-close" id="dialog-close" aria-label="Schließen">✕</button>
      <div class="dialog-header">
        <div class="dialog-badge" id="dialog-badge"></div>
        <div>
          <h2 id="dialog-name"></h2>
          <p id="dialog-sub" class="dialog-sub"></p>
        </div>
      </div>
      <div class="dialog-status-row">
        <span class="status-pill" id="status-pill">Nicht besucht</span>
      </div>
      <div id="visit-info" class="visit-info hidden">
        <div class="info-row">
          <span class="info-label">📅 Besucht am</span>
          <span id="info-date" class="info-value">—</span>
        </div>
        <div class="info-row info-row--notes">
          <span class="info-label">📝 Notizen</span>
          <span id="info-notes" class="info-value">—</span>
        </div>
      </div>
      <div id="visit-form" class="visit-form hidden">
        <div class="form-group">
          <label for="form-date">Besuchsdatum</label>
          <input type="date" id="form-date" class="form-input">
        </div>
        <div class="form-group">
          <label for="form-notes">Notizen</label>
          <textarea id="form-notes" class="form-input form-textarea" placeholder="Cache-Namen, Erlebnisse…" rows="3" maxlength="2000"></textarea>
        </div>
        <div class="form-actions">
          <button id="btn-toggle-visit" class="btn btn-primary"></button>
          <button id="btn-save-visit" class="btn btn-secondary hidden">Speichern</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Login-Dialog ── -->
  <div id="login-dialog" class="dialog hidden" role="dialog" aria-modal="true">
    <div class="dialog-inner">
      <button class="dialog-close" id="login-close" aria-label="Schließen">✕</button>
      <div class="dialog-header">
        <div class="dialog-badge">◈</div>
        <div>
          <h2>Anmelden</h2>
          <p class="dialog-sub">Erhalte einen Login-Link per E-Mail.</p>
        </div>
      </div>
      <div class="form-group">
        <label for="login-email">E-Mail-Adresse</label>
        <input type="email" id="login-email" class="form-input" placeholder="deine@email.de" autocomplete="email">
      </div>
      <div class="form-actions">
        <button id="btn-send-magic" class="btn btn-primary">Link senden</button>
      </div>
      <p id="login-msg" class="login-msg hidden"></p>
    </div>
  </div>

  <div id="backdrop" class="backdrop hidden"></div>

  <script src="js/api.js?v=dev"></script>
  <script src="js/auth-menu.js?v=dev"></script>
  <script src="js/page-meta.js?v=dev"></script>
  <script src="js/routes.js?v=dev"></script>
  <script src="js/outline.js?v=dev"></script>
  <script src="js/map.js?v=dev"></script>
  <script src="js/export.js?v=dev"></script>
  <script src="js/app.js?v=dev"></script>
</body>
</html>
