<!DOCTYPE html>
<html lang="de" class="stats-page">
<head>
  <meta charset="UTF-8">
  <!-- Content-Security-Policy: nur eigene Skripte, Schriften und API; Kacheln von OSM.
       'unsafe-inline' bei Styles wegen style="…" in HTML und innerHTML-Templates.
       frame-ancestors wirkt nur als HTTP-Header (public/.htaccess). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/app/">
  <title>Statistiken – CacheCounty</title>
  <meta name="description" content="Statistiken, Meilensteine und Rangliste bei CacheCounty: Wie viele Landkreise, Bezirke und Kommunen hat ein Geocacher schon besucht?">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CacheCounty">
  <meta property="og:locale" content="de_DE">
  <meta property="og:title" content="Statistiken – CacheCounty">
  <meta property="og:description" content="Statistiken, Meilensteine und Rangliste bei CacheCounty: Wie viele Landkreise, Bezirke und Kommunen hat ein Geocacher schon besucht?">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#3a2e1f">

  <script src="vendor/chart.js/4.5.1/chart.umd.min.js"></script>

  <link rel="stylesheet" href="vendor/fonts/fonts.css">

  <link rel="stylesheet" href="css/app.css?v=dev">
</head>
<body class="stats-page">

  <header id="app-header">
    <div class="header-inner">
      <a href="/" class="logo" style="text-decoration:none;">
        <span class="logo-icon">◈</span>
        <span class="logo-text">Cache<em>County</em></span>
      </a>
      <div class="header-center">
        <select id="country-select" class="country-select" aria-label="Land auswählen"></select>
      </div>
      <div class="header-right">
        <div id="auth-area">
          <button id="btn-login" class="btn btn-ghost">Anmelden</button>
        </div>
      </div>
    </div>
  </header>

  <main id="stats-main">

    <!-- Seitenheader mit Nutzerinformation -->
    <div class="stats-hero">
      <div class="stats-hero-inner">
        <div class="stats-hero-avatar" id="hero-avatar"></div>
        <div>
          <h1 class="stats-hero-title" id="hero-title">Statistiken</h1>
          <p class="stats-hero-sub" id="hero-sub"></p>
        </div>
      </div>
    </div>

    <!-- Sektion 1: Ländervergleich -->
    <section class="stats-section" id="section-countries">
      <h2 class="stats-section-title">Ländervergleich</h2>
      <div id="countries-list" class="countries-list"></div>
    </section>

    <!-- Sektion 2: Zeitverlauf -->
    <section class="stats-section" id="section-timeline">
      <h2 class="stats-section-title">Zeitlicher Verlauf</h2>
      <div class="chart-wrap">
        <canvas id="timeline-chart"></canvas>
      </div>
      <p class="chart-hint" id="timeline-hint"></p>
    </section>

    <!-- Sektion 3: Fortschritt je Bundesland -->
    <section class="stats-section" id="section-states">
      <h2 class="stats-section-title">Fortschritt je <span id="state-label-heading">Bundesland</span> – <span id="states-country-label"></span></h2>
      <div id="states-list" class="states-progress-list"></div>
    </section>

    <!-- Sektion 4: Meilensteine -->
    <section class="stats-section" id="section-milestones">
      <h2 class="stats-section-title">Meilensteine – <span id="milestones-country-label"></span></h2>
      <div id="milestones-grid" class="milestone-grid"></div>
    </section>

    <!-- Sektion 5: Rangliste -->
    <section class="stats-section" id="section-leaderboard">
      <h2 class="stats-section-title">Rangliste</h2>
      <div class="leaderboard-tabs">
        <button class="lb-tab active">Gesamt</button>
      </div>
      <div id="leaderboard-wrap">
        <table class="leaderboard-table" id="leaderboard-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Nutzer</th>
              <th>Besucht</th>
            </tr>
          </thead>
          <tbody id="leaderboard-body"></tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- Login-Dialog -->
  <div class="backdrop hidden" id="backdrop"></div>
  <div class="dialog hidden" id="login-dialog" role="dialog" aria-modal="true">
    <div class="dialog-inner">
      <button class="dialog-close" id="login-close" aria-label="Schließen">✕</button>
      <div class="dialog-header">
        <div class="dialog-badge">✉</div>
        <div>
          <h2>Anmelden</h2>
          <p class="dialog-sub">Magic Link per E-Mail</p>
        </div>
      </div>
      <div class="visit-form" id="login-form">
        <div class="form-group">
          <label for="login-email">E-Mail-Adresse</label>
          <input type="email" id="login-email" class="form-input" placeholder="du@beispiel.de" autocomplete="email">
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" id="btn-send-link">Link senden</button>
        </div>
        <p id="login-msg" class="login-msg" style="display:none;"></p>
      </div>
    </div>
  </div>

  <script src="js/api.js?v=dev"></script>
  <script src="js/auth-menu.js?v=dev"></script>
  <script src="js/page-meta.js?v=dev"></script>
  <script src="js/routes.js?v=dev"></script>
  <script src="js/stats.js?v=dev"></script>
</body>
</html>
